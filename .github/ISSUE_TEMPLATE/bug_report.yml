name: Bug report
description: Something RevenueDot does wrong, with the steps to see it.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Security problems go to security@revenuedot.app instead, never here (see [SECURITY.md](https://github.com/revenuedot/.github/blob/main/SECURITY.md)).
  - type: dropdown
    id: where
    attributes:
      label: Where it runs
      options:
        - RevenueDot Cloud (app.revenuedot.app)
        - Self-hosted (Docker, Helm, Terraform)
        - An SDK fork (say which one below)
        - The importer CLI (`npx revenuedot`)
        - The MCP server or agent skills
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Server version or image tag, SDK version, or CLI version.
      placeholder: "purchases-ios 5.91.0-revenuedot, server image 2026-10-03"
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what RevenueDot did instead. Request ids, webhook event ids and app user ids help.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Configure the SDK with ...
        2. Purchase ...
        3. See ...
  - type: textarea
    id: logs
    attributes:
      label: Logs and screenshots
      description: Redact API keys, secret keys and customer emails.
      render: text
